<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#ff6a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PW STOCK ORDER">

<link rel="manifest" href="./manifest.json?v=3">
<link rel="apple-touch-icon" href="./icon-192.png?v=3">

<title>PW STOCK ORDER</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ff6a00;
  font-family:Arial,Helvetica,sans-serif;
}

#appFrame{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#ff6a00;
  opacity:0;
  transition:opacity .3s ease;
}

#appFrame.ready{
  opacity:1;
}

#launchSplash{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  background:linear-gradient(
    145deg,
    #f45100 0%,
    #ff6a00 52%,
    #ff8a2b 100%
  );
  opacity:1;
  visibility:visible;
  transition:opacity .3s ease,visibility .3s ease;
}

#launchSplash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.logoCard{
  width:150px;
  height:150px;
  margin:0 auto 18px;
  padding:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:30px;
  background:#ffffff;
  box-shadow:0 18px 45px rgba(111,38,0,.24);
}

.logoCard img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

.welcome{
  color:#ffffff;
  font-size:17px;
  font-weight:900;
  letter-spacing:1.8px;
}

.tag{
  margin-top:8px;
  color:#ffffff;
  font-size:12px;
  font-weight:800;
  letter-spacing:2.2px;
}

.loader{
  width:150px;
  height:5px;
  margin:24px auto 0;
  border-radius:99px;
  background:rgba(255,255,255,.3);
  overflow:hidden;
}

.loader::after{
  content:"";
  display:block;
  width:45%;
  height:100%;
  border-radius:99px;
  background:#ffffff;
  animation:loading 1.15s ease-in-out infinite;
}

@keyframes loading{
  from{transform:translateX(-110%)}
  to{transform:translateX(330%)}
}
</style>
</head>

<body>

<div id="launchSplash">
  <div>
    <div class="logoCard">
      <img src="./icon-512.png?v=3" alt="Potatowala Logo">
    </div>

    <div class="welcome">WELCOME TO POTATOWALA</div>
    <div class="tag">STOCK MANAGEMENT</div>
    <div class="loader"></div>
  </div>
</div>

<iframe
  id="appFrame"
  src="https://script.google.com/macros/s/AKfycbxunKypFrlRJmvlZmdzd0QvipNcGxZOSZCP6I_06UJIPb1IU6r4tNWWdAUNbdLFqjVo/exec"
  title="PW STOCK ORDER"
  allow="clipboard-read; clipboard-write">
</iframe>

<script>
const startedAt = Date.now();
const frame = document.getElementById("appFrame");
const splash = document.getElementById("launchSplash");

frame.addEventListener("load", function(){
  const remaining = Math.max(0, 1000 - (Date.now() - startedAt));

  setTimeout(function(){
    frame.classList.add("ready");
    splash.classList.add("hide");

    setTimeout(function(){
      splash.remove();
    }, 350);
  }, remaining);
});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js?v=3");
  });
}
</script>

</body>
</html>
